name: Fracta checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: fracta
      - uses: actions/checkout@v4
        with:
          repository: Cerune-Lang/Cerune
          ref: master
          path: cerune
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Build Cerune
        working-directory: cerune
        run: cargo build --locked --bin cerune
      - name: Test trap checker
        run: python3 -m unittest discover -s fracta/tests -v
      - name: Verify safe runtime traps
        run: python3 fracta/scripts/check_traps.py --binary cerune/target/debug/cerune --cases fracta/cases
